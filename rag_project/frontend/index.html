<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>음악 추천 챗봇</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
    margin: 0;
    background: #0f0f12;
    color: #e8e8ea;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* ---------- 사이드바 ---------- */
  #sidebar {
    width: 240px;
    background: #17171b;
    border-right: 1px solid #26262c;
    display: flex;
    flex-direction: column;
    padding: 16px;
    flex-shrink: 0;
  }
  #sidebar h2 {
    font-size: 18px;
    background: linear-gradient(135deg, #c77dff, #ff6ec7);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin: 0 0 16px 4px;
  }
  #new-chat-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    background: linear-gradient(135deg, #a855f7, #ec4899);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 14px;
    cursor: pointer;
    margin-bottom: 16px;
  }
  #new-chat-btn:hover { opacity: 0.9; }
  #history-label {
    font-size: 12px;
    color: #6b6b74;
    margin: 4px 4px 8px;
  }
  #history-list {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .history-item {
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 13px;
    color: #b0b0b8;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }
  .history-item .history-title {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
  }
  .history-item:hover { background: #1f1f25; }
  .history-item.active { background: #2a1f33; color: #e29bff; font-weight: 500; }

  .history-delete-btn {
    display: none;
    background: none;
    border: none;
    color: #6b6b74;
    font-size: 14px;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 4px;
    flex-shrink: 0;
  }
  .history-item:hover .history-delete-btn { display: block; }
  .history-delete-btn:hover { background: #33333c; color: #ff6ec7; }

  /* ---------- 메인 영역 ---------- */
  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 24px 32px;
    max-width: 720px;
    margin: 0 auto;
    width: 100%;
  }

  /* ---------- 랜딩 화면 ---------- */
  #landing-view {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 28px;
  }
  #landing-view h1 {
    font-size: 32px;
    font-weight: 700;
    margin: 0;
    background: linear-gradient(135deg, #c77dff, #ff6ec7, #a855f7);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    line-height: 1.4;
  }
  #start-chat-btn {
    padding: 14px 32px;
    border-radius: 28px;
    border: none;
    background: linear-gradient(135deg, #a855f7, #ec4899);
    color: white;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(168, 85, 247, 0.35);
  }
  #start-chat-btn:hover { opacity: 0.9; transform: translateY(-1px); }

  /* ---------- 채팅 화면 ---------- */
  #chat-view {
    flex: 1;
    display: none;
    flex-direction: column;
    min-height: 0;
  }
  #chat-container {
    background: #17171b;
    border: 1px solid #26262c;
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
    padding: 20px;
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  #chat {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }

  .empty-state {
    margin-top: auto;
    text-align: center;
    color: #6b6b74;
    padding: 20px 0;
  }
  .suggestions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-top: 16px;
  }
  .suggestion-chip {
    background: #26262c;
    color: #e29bff;
    border: 1px solid #3a3a42;
    border-radius: 20px;
    padding: 10px 18px;
    font-size: 14px;
    cursor: pointer;
  }
  .suggestion-chip:hover { background: #2e2e36; }

  .msg-row {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    margin: 10px 0;
  }
  .msg-row.user { justify-content: flex-end; }
  .msg-row.bot { justify-content: flex-start; }

  .avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }
  .msg-row.user .avatar { background: #3a2540; }
  .msg-row.bot .avatar { background: #26262c; }

.bubble {
  max-width: 75%;
  padding: 10px 16px;
  border-radius: 18px;
  line-height: 1.5;
  white-space: pre-wrap;
  font-size: 15px;
  background: #26262c;
  color: #e8e8ea;
  box-shadow: 0 0 16px rgba(168, 85, 247, 0.08);  /* 봇 말풍선 기본 은은한 보라 글로우 */
}
.user .bubble {
  background: linear-gradient(135deg, #a855f7, #ec4899);
  color: white;
  border-bottom-right-radius: 4px;
  box-shadow: 0 0 20px rgba(236, 73, 153, 0.35);  /* 사용자 말풍선 - 핑크 네온 */
}
  .bot .bubble { border-bottom-left-radius: 4px; }
  .bot .bubble a { color: #e29bff; text-decoration: underline; word-break: break-all; }
  .user .bubble a { color: white; text-decoration: underline; }
  .bubble strong { font-weight: 600; }
  .bubble.spotify strong { color: #1DB954; }
  .bubble.youtube strong { color: #ff5c5c; }

  .bubble.spotify,
  .bubble.youtube {
    box-shadow: 0 0 24px rgba(236, 73, 153, 0.25);
  }
  .source-tag {
    font-size: 12px;
    font-weight: 500;
    padding: 4px 12px;
    border-radius: 999px;
    display: inline-block;
    margin-bottom: 8px;
    line-height: 1.4;
  }
  .source-tag.spotify { background-color: #123a24; color: #3ddc84; }
  .source-tag.youtube { background-color: #3a1414; color: #ff7a7a; }

  form {
    display: flex;
    gap: 8px;
    background: transparent;
    padding: 12px 0 0 0;
    border-top: 1px solid #26262c;
    margin-top: 12px;
  }
  input {
    flex: 1;
    padding: 12px 16px;
    border-radius: 24px;
    border: 1px solid #33333c;
    font-size: 15px;
    outline: none;
    background: #1f1f25;
    color: #e8e8ea;
  }
  input::placeholder { color: #6b6b74; }
  input:focus { border-color: #a855f7; }

  @keyframes bounce-hint {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }
  input.bounce { animation: bounce-hint 1.2s ease-in-out infinite; }

  button[type="submit"] {
    padding: 12px 20px;
    border-radius: 24px;
    border: none;
    background: linear-gradient(135deg, #a855f7, #ec4899);
    color: white;
    font-size: 15px;
    cursor: pointer;
  }
  button[type="submit"]:hover { opacity: 0.9; }
  button[type="submit"]:disabled { background: #33333c; opacity: 1; cursor: not-allowed; }
</style>
</head>
<body>

  <div id="sidebar">
    <h2>🎵 Music Recommendation Chatbot</h2>
    <button id="new-chat-btn" type="button">+ New chat</button>
    <div id="history-label">History</div>
    <div id="history-list"></div>
  </div>

  <div id="main">

    <!-- 랜딩 화면 -->
    <div id="landing-view">
      <h1>검색하고 싶은<br>음악을 입력하세요</h1>
      <button id="start-chat-btn" type="button">음악 추천 받기</button>
    </div>

    <!-- 채팅 화면 -->
    <div id="chat-view">
      <div id="chat-container">
        <div id="chat">
          <div id="empty-state" class="empty-state">
            <p>검색하고 싶은 음악을 입력하세요</p>
            <div class="suggestions">
              <button class="suggestion-chip" data-q="흐린 날 듣기 좋은 노래 추천해줘">흐린 날 듣기 좋은 노래</button>
              <button class="suggestion-chip" data-q="신나는 케이팝 추천해줘">신나는 케이팝</button>
              <button class="suggestion-chip" data-q="Bruno Mars 노래 추천해줘">Bruno Mars 노래</button>
            </div>
          </div>
        </div>
        <form id="chat-form">
          <input id="question" class="bounce" placeholder="예: 흐린 날 듣기 좋은 노래 추천해줘" autocomplete="off" required />
          <button type="submit" id="send-btn">↑</button>
        </form>
      </div>
    </div>

  </div>

<script>
const landingView = document.getElementById('landing-view');
const chatView = document.getElementById('chat-view');
const startChatBtn = document.getElementById('start-chat-btn');

const chat = document.getElementById('chat');
const form = document.getElementById('chat-form');
const input = document.getElementById('question');
const sendBtn = document.getElementById('send-btn');
const historyList = document.getElementById('history-list');
const newChatBtn = document.getElementById('new-chat-btn');

const EMPTY_STATE_HTML = `
  <div id="empty-state" class="empty-state">
    <p>검색하고 싶은 음악을 입력하세요</p>
    <div class="suggestions">
      <button class="suggestion-chip" data-q="흐린 날 듣기 좋은 노래 추천해줘">흐린 날 듣기 좋은 노래</button>
      <button class="suggestion-chip" data-q="신나는 케이팝 추천해줘">신나는 케이팝</button>
      <button class="suggestion-chip" data-q="Bruno Mars 노래 추천해줘">Bruno Mars 노래</button>
    </div>
  </div>`;

// ---------- 화면 전환 ----------
function showChatView() {
  landingView.style.display = 'none';
  chatView.style.display = 'flex';
  input.focus();
}

function showLandingView() {
  landingView.style.display = 'flex';
  chatView.style.display = 'none';
}

startChatBtn.addEventListener('click', () => {
  showChatView();
  if (sessions.length === 0) startNewChat();
});

// ---------- 세션(History) 관리 ----------
let sessions = JSON.parse(localStorage.getItem('music_chat_sessions') || '[]');
let currentSessionId = null;

function saveSessions() {
  localStorage.setItem('music_chat_sessions', JSON.stringify(sessions));
}

function renderHistory() {
  historyList.innerHTML = '';
  sessions.slice().reverse().forEach(session => {
    const item = document.createElement('div');
    item.className = 'history-item' + (session.id === currentSessionId ? ' active' : '');

    const titleSpan = document.createElement('span');
    titleSpan.className = 'history-title';
    titleSpan.textContent = session.title || '새 대화';
    titleSpan.addEventListener('click', () => {
      loadSession(session.id);
      showChatView();
    });

    const deleteBtn = document.createElement('button');
    deleteBtn.className = 'history-delete-btn';
    deleteBtn.type = 'button';
    deleteBtn.textContent = '✕';
    deleteBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      deleteSession(session.id);
    });

    item.appendChild(titleSpan);
    item.appendChild(deleteBtn);
    historyList.appendChild(item);
  });
}

function deleteSession(id) {
  sessions = sessions.filter(s => s.id !== id);
  saveSessions();
  if (id === currentSessionId) {
    if (sessions.length > 0) {
      loadSession(sessions[sessions.length - 1].id);
    } else {
      currentSessionId = null;
      showLandingView();
    }
  } else {
    renderHistory();
  }
}

function startNewChat() {
  currentSessionId = Date.now().toString();
  sessions.push({ id: currentSessionId, title: '새 대화', messages: [] });
  saveSessions();
  chat.innerHTML = EMPTY_STATE_HTML;
  bindSuggestionChips();
  renderHistory();
}

function loadSession(id) {
  const session = sessions.find(s => s.id === id);
  if (!session) return;
  currentSessionId = id;
  chat.innerHTML = '';
  if (session.messages.length === 0) {
    chat.innerHTML = EMPTY_STATE_HTML;
    bindSuggestionChips();
  } else {
    session.messages.forEach(m => addMessage(m.text, m.sender, m.source, false));
  }
  renderHistory();
}

function getCurrentSession() {
  return sessions.find(s => s.id === currentSessionId);
}

// ---------- 메시지 렌더링 ----------
function linkify(text) {
  const urlRegex = /(https?:\/\/[^\s)]+)/g;
  return text.replace(urlRegex, (url) => {
    const cleanUrl = url.replace(/[.,;)]+$/, '');
    return `<a href="${cleanUrl}" target="_blank" rel="noopener noreferrer">${cleanUrl}</a>`;
  });
}

function boldify(text) {
  return text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
}

function addMessage(text, sender, source, persist = true) {
  const emptyState = document.getElementById('empty-state');
  if (emptyState) emptyState.remove();

  const row = document.createElement('div');
  row.className = `msg-row ${sender}`;

  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = sender === 'user' ? '👤' : '💬';

  const bubble = document.createElement('div');
  bubble.className = `bubble ${source ? source : ''}`;

  if (source && source !== 'none') {
    const tag = document.createElement('span');
    tag.className = `source-tag ${source}`;
    tag.textContent = source === 'spotify' ? '🎧 Spotify' : '📺 YouTube';
    bubble.appendChild(tag);
    bubble.appendChild(document.createElement('br'));
    bubble.appendChild(document.createElement('br'));
  }

  const textSpan = document.createElement('span');
  textSpan.className = 'answer-text'; 
  const escaped = text.replace(/</g, '&lt;').replace(/>/g, '&gt;');
  textSpan.innerHTML = boldify(linkify(escaped));
  bubble.appendChild(textSpan);

  if (sender === 'user') {
    row.appendChild(bubble);
    row.appendChild(avatar);
  } else {
    row.appendChild(avatar);
    row.appendChild(bubble);
  }

  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;

  if (persist) {
    const session = getCurrentSession();
    if (session) {
      session.messages.push({ text, sender, source });
      if (sender === 'user' && session.title === '새 대화') {
        session.title = text.slice(0, 20);
      }
      saveSessions();
      renderHistory();
    }
  }
  return row;
}

function bindSuggestionChips() {
  document.querySelectorAll('.suggestion-chip').forEach(btn => {
    btn.addEventListener('click', () => {
      input.value = btn.dataset.q;
      form.requestSubmit();
    });
  });
}

async function sendStreamingMessage(question, history) {
  const res = await fetch('/search/stream', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ question, history })
  });

  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';
  let source = null;
  let answerRow = null;
  let fullText = '';

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;

    buffer += decoder.decode(value, { stream: true });
    const lines = buffer.split('\n\n');
    buffer = lines.pop();  // 마지막 미완성 조각은 다음 루프로 넘김

    for (const line of lines) {
      if (!line.startsWith('data: ')) continue;
      const payload = line.slice(6);
      if (payload === '[DONE]') continue;

      const event = JSON.parse(payload);
      if (event.type === 'meta') {
        source = event.source;
        answerRow = addMessage('', 'bot', source, false);  
      } else if (event.type === 'token') {
        fullText += event.text;
        updateMessageText(answerRow, fullText);      
      }
    }
  }
  const session = getCurrentSession();
  if (session) {
    session.messages.push({ text: fullText, sender: 'bot', source });
    saveSessions();
    renderHistory();
  }
}


function updateMessageText(row, text) {
  const textSpan = row.querySelector('.answer-text');
  const escaped = text.replace(/</g, '&lt;').replace(/>/g, '&gt;');
  textSpan.innerHTML = boldify(linkify(escaped));
  chat.scrollTop = chat.scrollHeight;
}

// ---------- 이벤트 ----------
newChatBtn.addEventListener('click', () => {
  startNewChat();
  showChatView();
});

input.addEventListener('input', () => {
  input.classList.toggle('bounce', input.value.length === 0);
});

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const question = input.value.trim();
  if (!question) return;

  const session = getCurrentSession();
  const history = [];
  if (session) {
    for (let i = 0; i < session.messages.length - 1; i++) {
      if (session.messages[i].sender === 'user' && session.messages[i + 1].sender === 'bot') {
        history.push({ question: session.messages[i].text, answer: session.messages[i + 1].text });
      }
    }
  }

  addMessage(question, 'user');
  input.value = '';
  sendBtn.disabled = true;

  try {
    await sendStreamingMessage(question, history.slice(-1));
  } catch (err) {
    addMessage('오류가 발생했어요: ' + err.message, 'bot', null, false);
  } finally {
    sendBtn.disabled = false;
  }
});

// ---------- 초기화 ----------
bindSuggestionChips();
renderHistory();
showLandingView();  // 항상 랜딩 화면부터 시작
</script>
</body>
</html>
